<form (ngSubmit)="onSubmit()" #form>
  <app-control label="Title">
    <input type="text" id="title" name="title" #titleInput #input [(ngModel)]="enteredTitle" />
  </app-control>
  <app-control label="Request">
    <textarea name="request" id="request" #ticketText rows="3" [(ngModel)]="enteredRequest"></textarea>
  </app-control>
  <button appButton>
    Submit
    <span ngProjectAs="icon"> ⌲ </span>
  </button>
</form>
